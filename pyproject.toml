[project]
name = "herculex"
version = "0.1.0"
description = "Unwrapping Herculaneum scrolls from CT and reading their ink, on Apple silicon or an NVIDIA GPU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "tifffile>=2024.8",
    "imagecodecs>=2024.6",
    "pillow>=10.4",
    "zstandard>=0.23",
    "pyarrow>=17",
]

[project.optional-dependencies]
apple = ["herculex[reader]", "coremltools>=9.0", "mlx>=0.29"]
cuda = ["herculex[reader]"]
reader = [
    "torch>=2.6,<3",
    "timm>=1.0",
    "einops>=0.8",
    "dynamic-network-architectures>=0.3",
    "zarr>=2.18,<3",
    "s3fs>=2025.9",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pynrrd>=1.1",
    "edt>=3.0",
    "nest-asyncio>=1.6",
    "scikit-image>=0.26",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff==0.17.4", "clang-format==23.1.5", "clang-tidy==23.1.4", "shellcheck-py==0.11.0.1", "shfmt-py==4.2.0"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["runtime", "records", "backups", "logs/runs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PERF", "PLE", "PLW", "RUF", "PT", "FURB", "T10", "ARG002", "ARG003", "ARG004"]
ignore = [
    "E501",     # the formatter wraps code; long strings and URLs stay whole
    "B905",     # zip() truncation is relied on in places; strict=True would change behaviour
    "RUF001",   # µ, ×, – are meant in user-facing text
    "RUF002",
    "RUF003",
    "PT018",    # one assert per scenario reads as the scenario's claim
    "PLW0603",  # module globals hold per-process workers and models
    "PLW2901",  # loop values are narrowed in place in numeric code
    "SIM115",   # files held open across a pool or a lock on purpose
    "PERF401",  # explicit loops kept where they read as the algorithm
    "RUF046",   # int(round(x)) also turns numpy scalars into Python ints
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG002", "B006", "B023"]
"unwrapping/layout/mosaic_layout.py" = ["B023"]

[tool.ruff.format]
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ports: the native ports of community tools in ports/, which the pipeline does not call",
    "apple: needs the Apple lane (Metal, the Neural Engine)",
    "cuda: needs the CUDA lane (an NVIDIA GPU)",
]
tmp_path_retention_policy = "failed"
