    if(base&&heat){gl.enable(gl.STENCIL_TEST);gl.stencilFunc(gl.ALWAYS,1,255);pass(base,3,heatScan);gl.stencilFunc(gl.EQUAL,1,255);pass(L,2,1);gl.disable(gl.STENCIL_TEST)}
    else if(base){pass(base,0,scan);pass(L,1,1)}else pass(L,heat&&isInk(L)?2:0,1)}
  const middle=(t,S=2**(t.l-lvl))=>Math.hypot(t.c*S-(ox+vw/2)/ts,t.r*S-(oy+vh/2)/ts);wanted.sort((a,b)=>b.l-a.l||middle(a)-middle(b));pump();evict();
  }
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,W,H);
  cx.setTransform(fx?-s:s,0,0,fy?-s:s,fx?W+ox*s:-ox*s,fy?H+oy*s:-oy*s);
  for(const k of drawing?[...marks,drawing]:marks)if(seen(k)&&k.box[0]<ox+vw&&k.box[2]>ox&&k.box[1]<oy+vh&&k.box[3]>oy)ink(k,s);
  if(boxes&&M.boxes.length){cx.shadowColor='#f00';cx.shadowBlur=6*d;cx.strokeStyle='#f00';cx.lineWidth=d/s;
    for(const b of M.boxes)if(b.x<ox+vw&&b.x+b.w>ox&&b.y<oy+vh&&b.y+b.h>oy)cx.strokeRect(b.x,b.y,b.w,b.h);
    cx.shadowBlur=0}
  if(boxes&&M.outlines.length){cx.shadowColor='#ffd60a';cx.shadowBlur=8*d;cx.strokeStyle='#ffd60a';cx.lineWidth=2*d/s;cx.lineJoin='round';cx.beginPath();
    for(const o of M.outlines)for(const r of o.runs){cx.moveTo(r[0][0],r[0][1]);for(let i=1;i<r.length;i++)cx.lineTo(r[i][0],r[i][1])}
    cx.stroke();cx.shadowBlur=0}
  if(boxes&&M.suggested.length){cx.shadowColor='#0ff';cx.shadowBlur=6*d;cx.strokeStyle='#0ff';cx.lineWidth=2*d/s;
    for(const b of M.suggested)if(b.x<ox+vw&&b.x+b.w>ox&&b.y<oy+vh&&b.y+b.h>oy)cx.strokeRect(b.x,b.y,b.w,b.h);
    cx.shadowBlur=0;cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#0ff';cx.font=13*d+'px Calibri';
    for(const b of M.suggested)if(b.x<ox+vw&&b.x+b.w>ox&&b.y<oy+vh&&b.y+b.h>oy){const at=(v,o,flip,size)=>flip?size+(o-v)*s:(v-o)*s;
      const lx=Math.min(at(b.x,ox,fx,W),at(b.x+b.w,ox,fx,W)),ly=Math.min(at(b.y,oy,fy,H),at(b.y+b.h,oy,fy,H))-5*d;
      cx.fillStyle='#000';cx.fillRect(lx-2*d,ly-13*d,cx.measureText(b.label).width+4*d,17*d);cx.fillStyle='#0ff';cx.fillText(b.label,lx,ly)}}

  bar.style.width=nice*zoom+'px';
  label.textContent=(nice>=10?nice/10+' cm':nice+' mm')+' · '+M.title+' · '+L.name+(M.tint=='purple'&&L.path.endsWith('taught')&&!M.title.includes(L.model||'post-trained Reader v3')?' · '+(L.model||'post-trained Reader v3')+' model':'')+(tool&&tool!='erase'?' · marker '+brush.toFixed(2)+' mm':'')+writes.status();

}
const held_keys=Shortcuts.held;let then=performance.now();
function move(now){const dt=Math.min(.05,(now-then)/1000);then=now;if(!held_keys.size)return;const m=mirror!==turn?-1:1,n=turn?-1:1,sx=PAN_SPEED*innerWidth/zoom*dt,sy=PAN_SPEED*innerHeight/zoom*dt;
  if(held_keys.has('a'))ox-=m*sx;if(held_keys.has('d'))ox+=m*sx;if(held_keys.has('w'))oy-=n*sy;if(held_keys.has('s'))oy+=n*sy;
  if(held_keys.has('e'))zoomBy(Math.exp(-ZOOM_SPEED*dt));if(held_keys.has('r'))zoomBy(Math.exp(ZOOM_SPEED*dt));invalidate()}

function fit(b,margin){const top=document.querySelector('nav').offsetHeight||TOP,m=margin||1.02;zoom=Math.min(innerWidth/(b.w*m),Math.max(100,innerHeight-top)/(b.h*m));
  ox=b.x+b.w/2-innerWidth/zoom/2;oy=b.y+b.h/2-(innerHeight+top)/zoom/2;invalidate()}
function go(k){pick=-1;spot=(k+spots.length)%spots.length;fit(spots[spot],M.boxes.length?1.25:1.06)}
function suggest(){spot=-1;pick=(pick+1)%M.suggested.length;fit(M.suggested[pick],1.25)}
function voxel(){const cxm=ox+innerWidth/zoom/2,cym=oy+innerHeight/zoom/2;zoom=1/(M.layers[layer].mm*devicePixelRatio);ox=cxm-innerWidth/zoom/2;oy=cym-innerHeight/zoom/2;invalidate()}

if(M.boxes.length)go(0);else fit(M.area);
if(M.suggested.length){el('suggested').disabled=false;el('suggested').title='Next suggested area (J)';el('suggested').onclick=suggest}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);
  if(tool&&!panning){const p=sheetAt(e);if(tool=='erase'){if(p)wipe(p)}else if(p){drawing=placed({kind:tool,width_mm:tool=='spot'?SPOT_MM:brush,points:[p]});invalidate(true)}return}
  dn=[e.clientX,e.clientY,ox,oy];cv.classList.add('drag')};
cv.onpointermove=e=>{if(drawing){const p=sheetAt(e),q=drawing.points[drawing.points.length-1];if(p&&Math.hypot(p[0]-q[0],p[1]-q[1])*zoom>=1){drawing.points.push(p);placed(drawing);invalidate(true)}return}
  if(tool=='erase'&&e.buttons&&!panning){const p=sheetAt(e);if(p)wipe(p);return}
  if(!dn)return;const m=mirror!==turn?-1:1,n=turn?-1:1;ox=dn[2]-m*(e.clientX-dn[0])/zoom;oy=dn[3]-n*(e.clientY-dn[1])/zoom;invalidate()};
cv.onpointerup=()=>{dn=null;cv.classList.remove('drag');if(drawing){const k=drawing;drawing=null;marks.push(k);writes.add(k,M.layers[layer].name)}};
cv.onpointercancel=cv.onpointerup;
cv.addEventListener('wheel',e=>{e.preventDefault();
  const px=mirror!==turn?innerWidth-e.clientX:e.clientX,py=turn?innerHeight-e.clientY:e.clientY,a=ox+px/zoom,b=oy+py/zoom;
  zoom=Math.min(zoomLimit(),Math.max(.03,zoom*Math.exp(-e.deltaY*.0022)));ox=a-px/zoom;oy=b-py/zoom;invalidate()},{passive:false});
const lab=f=>()=>{if(!el('marking').hidden)f()},nudge=(dx,dy)=>()=>{ox+=dx*innerWidth*.6/zoom;oy+=dy*innerHeight*.6/zoom;invalidate()};
Shortcuts.bind({wake:invalidate,start:()=>{then=performance.now()},move:true,
  panLeft:nudge(-1,0),panRight:nudge(1,0),panUp:nudge(0,-1),panDown:nudge(0,1),
  grab:()=>{panning=true;cv.style.cursor='grab'},grabEnd:()=>{panning=false;cv.style.cursor=tool?'crosshair':''},
  layerUp:()=>setLayer(layer+1),layerDown:()=>setLayer(layer-1),
  next:spots.length?()=>go(spot+1):null,previous:spots.length?()=>go(Math.max(spot,0)-1):null,
  voxel,boxes:()=>{boxes=!boxes;invalidate()},suggest:M.suggested.length?suggest:null,
  mark:lab(()=>useTool('ink')),erase:lab(()=>useTool('erase')),spot:lab(()=>useTool('spot')),undo:lab(undo),marks:lab(toggleMarks),greek:letters,
  brushDown:()=>{brush=Math.max(.02,brush/1.25);invalidate()},brushUp:()=>{brush=Math.min(20,brush*1.25);invalidate()},
  swap:()=>{if(taught>=0&&stock>=0)setLayer(layer==taught?stock:taught)},yellow:tinted,heat:heated,
  floorDown:()=>weakestBy(-8),floorUp:()=>weakestBy(8),
  scanDown:()=>scanBy(-.05),scanUp:()=>scanBy(.05),
  mirror:()=>el('mirror').click(),turn:()=>{turn=!turn;invalidate()},full,
  back:()=>{if(!document.fullscreenElement)location.href=M.back}});
el('keyhelp').onclick=()=>Shortcuts.help(true);

const colour={ink:'#ff3b30',blank:'#3a8dff',spot:'#39ff14'},SPOT_MM=.3;
function sheetToScreen(p){const s=shelves.find(s=>p[0]<s.x+s.w)||shelves[shelves.length-1];return[p[0]-s.x,p[1]+s.y]}
const updateSpotReadout=spotReadout(el('spot-coordinates'),M.scan,sheetToScreen);
function placed(k){const shown=k.points.map(sheetToScreen),path=new Path2D(),xs=shown.map(p=>p[0]),ys=shown.map(p=>p[1]),m=k.width_mm;shown.forEach(([x,y],i)=>i?path.lineTo(x,y):path.moveTo(x,y));if(shown.length==1)path.lineTo(shown[0][0]+.001,shown[0][1]);
  k.path=path;k.box=[Math.min(...xs)-m,Math.min(...ys)-m,Math.max(...xs)+m,Math.max(...ys)+m];return k}
function sheetAt(e){const px=mirror!==turn?innerWidth-e.clientX:e.clientX,py=turn?innerHeight-e.clientY:e.clientY,X=ox+px/zoom,Y=oy+py/zoom,s=shelves.find(s=>Y>=s.y&&Y<s.y+s.h&&X>=0&&X<s.w);
  return s?[+(X+s.x).toFixed(3),+(Y-s.y).toFixed(3)]:null}
function ink(k,s){cx.globalAlpha=.6;cx.strokeStyle=colour[k.kind];cx.lineWidth=Math.max(1/s,k.width_mm);cx.lineCap=cx.lineJoin='round';cx.stroke(k.path);cx.globalAlpha=1}
const writes=markWrites(M.scan,invalidate);
const discard=k=>{marks=marks.filter(m=>m!==k)};
function seen(k){return !k.removing&&(showMarks||!k.old)}
function toggleMarks(){showMarks=!showMarks;el('showmarks').textContent=showMarks?'Hide marks':'Show marks';invalidate(true)}
el('showmarks').onclick=toggleMarks;
function wipe(p){const k=marks.find(k=>seen(k)&&k.points.some(q=>Math.hypot(p[0]-q[0],p[1]-q[1])<=k.width_mm/2+3/zoom));if(k)writes.remove(k,discard)}
function undo(){const k=marks.filter(seen).pop();if(k)writes.remove(k,discard)}
function useTool(t){tool=tool==t?null:t;if(tool){el('labelling').classList.add('open');el('labelopen').setAttribute('aria-pressed',true);el('labelopen').setAttribute('aria-expanded',true)}for(const [id,name] of [['mark','ink'],['blank','blank'],['spotmark','spot'],['erase','erase']])el(id).setAttribute('aria-pressed',tool==name);cv.style.cursor=tool?'crosshair':'';invalidate(true)}
el('mark').onclick=()=>useTool('ink');el('spotmark').onclick=()=>useTool('spot');el('blank').onclick=()=>useTool('blank');el('erase').onclick=()=>useTool('erase');el('undo').onclick=undo;
function closeMenus(){for(const o of document.querySelectorAll('.menu.open')){o.classList.remove('open');o.querySelector('.opener').setAttribute('aria-expanded','false')}}
for(const m of document.querySelectorAll('.menu'))m.querySelector('.opener').onclick=e=>{e.stopPropagation();const open=!m.classList.contains('open');closeMenus();if(open&&el('labelling').classList.contains('open'))el('labelopen').click();m.classList.toggle('open',open);m.querySelector('.opener').setAttribute('aria-expanded',open)};
addEventListener('pointerdown',e=>{if(!e.target.closest('.menu'))closeMenus()});
for(const b of document.querySelectorAll('.menu .items button'))b.addEventListener('click',()=>closeMenus());
el('labelopen').onclick=()=>{closeMenus();const open=el('labelling').classList.toggle('open');el('labelopen').setAttribute('aria-pressed',open);el('labelopen').setAttribute('aria-expanded',open);if(!open&&tool)useTool(tool)};
if(M.scan&&location.protocol.startsWith('http'))fetch('/marks?scan='+M.scan).then(r=>r.ok?r.json():Promise.reject()).then(all=>{marks=all.map(k=>placed({...k,old:true}));el('marking').hidden=false;el('labelopen').disabled=false;invalidate(true)}).catch(()=>{});
const nav=document.querySelector('nav');
new ResizeObserver(()=>document.documentElement.style.setProperty('--toolbar-height',nav.offsetHeight+'px')).observe(nav);
for(const button of document.querySelectorAll('.menu>.opener'))button.setAttribute('aria-expanded','false');
addEventListener('keydown',e=>{if(e.key!=='Escape')return;const open=document.querySelector('.menu.open');if(open){open.classList.remove('open');open.querySelector('.opener').setAttribute('aria-expanded','false');open.querySelector('.opener').focus();e.stopImmediatePropagation()}else if(el('labelling').classList.contains('open')){el('labelopen').click();el('labelopen').focus();e.stopImmediatePropagation()}},true);
