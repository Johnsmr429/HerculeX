        paint(L,lvl,c,r,...place(x,y,Math.round(((c+1)*ts-sx)*s)-x,Math.round(((r+1)*ts-sy)*s)-y))}};
    const inks=on.inkY||on.inkP,bright=inks?scan:1;
    if(on.meshA)pass(layer['first-scan'],0,bright,1);
    if(on.meshB)pass(layer['new-scan'],0,bright,on.meshA?mix:1);
    if(on.inkY)pass(layer['first-ink'],1,1,1);
    if(on.inkP)pass(layer['new-ink'],2,1,1)}
  const middle=(t,S=2**(t.l-lvl))=>Math.hypot(t.c*S-(ox+vw/2)/ts,t.r*S-(oy+vh/2)/ts);wanted.sort((a,b)=>b.l-a.l||middle(a)-middle(b));pump();evict();
  }
  const nice=[.1,.2,.5,1,2,5,10,20,50,100,200,500,1000].find(v=>v>=100/zoom)||1000;
  bar.style.width=nice*zoom+'px';
  label.textContent=(nice>=10?nice/10+' cm':nice+' mm')+' · '+M.title+(tool=='spot'?' · circle a spot':tool=='erase'?' · erase':'')+writes.status();
  updateSpotReadout(marked,seen,{ox,oy,zoom,flipX:mirror});
  el('where').textContent=square>=0?(squares[square].mesh=='new'?'new':'first')+' square '+(square+1)+' / '+squares.length:spot<0?'':(spot+1)+' / '+spots.length;

}
const held_keys=Shortcuts.held;let then=performance.now();
function move(now){const dt=Math.min(.05,(now-then)/1000);then=now;if(!held_keys.size)return;const m=mirror?-1:1,sx=PAN_SPEED*innerWidth/zoom*dt,sy=PAN_SPEED*innerHeight/zoom*dt;
  if(held_keys.has('a'))ox-=m*sx;if(held_keys.has('d'))ox+=m*sx;if(held_keys.has('w'))oy-=sy;if(held_keys.has('s'))oy+=sy;
  if(held_keys.has('e'))zoomBy(Math.exp(-ZOOM_SPEED*dt));if(held_keys.has('r'))zoomBy(Math.exp(ZOOM_SPEED*dt));invalidate()}

function fit(b,margin){if(!innerWidth)return;const top=document.querySelector('nav').offsetHeight||TOP,m=margin||1.02;zoom=Math.min(innerWidth/(b.w*m),Math.max(100,innerHeight-top)/(b.h*m));ox=b.x+b.w/2-innerWidth/zoom/2;oy=b.y+b.h/2-(innerHeight+top)/zoom/2;invalidate()}
function go(k){square=-1;spot=(k+spots.length)%spots.length;fit(spots[spot],1.06)}
function step(k){if(!squares.length)return;square=(k+squares.length)%squares.length;const b=squares[square];fit({x:b.x-b.w,y:b.y-b.h,w:3*b.w,h:3*b.h},1)}
function voxel(){const cxm=ox+innerWidth/zoom/2,cym=oy+innerHeight/zoom/2;zoom=1/(M.layers[0].mm*devicePixelRatio);ox=cxm-innerWidth/zoom/2;oy=cym-innerHeight/zoom/2;invalidate()}
look();fit(M.area);if(!innerWidth)zoom=0;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);
  if(tool){const p=sheetAt(e);if(tool=='erase'){if(p)wipe(p)}else if(p){drawing={kind:tool,width_mm:SPOT_MM,points:[p]};invalidate(true)}return}
  dn=[e.clientX,e.clientY,ox,oy];cv.classList.add('drag')};
cv.onpointermove=e=>{if(drawing){const p=sheetAt(e),q=drawing.points[drawing.points.length-1];if(p&&Math.hypot(p[0]-q[0],p[1]-q[1])*zoom>=1){drawing.points.push(p);invalidate(true)}return}
  if(tool=='erase'&&e.buttons){const p=sheetAt(e);if(p)wipe(p);return}
  if(!dn)return;const m=mirror?-1:1;ox=dn[2]-m*(e.clientX-dn[0])/zoom;oy=dn[3]-(e.clientY-dn[1])/zoom;invalidate()};
cv.onpointerup=()=>{dn=null;cv.classList.remove('drag');if(drawing){const k=drawing;drawing=null;marked.push(k);writes.add(k,'two unwraps')}};cv.onpointercancel=cv.onpointerup;
cv.addEventListener('wheel',e=>{e.preventDefault();const px=mirror?innerWidth-e.clientX:e.clientX,py=e.clientY,a=ox+px/zoom,b=oy+py/zoom;zoom=Math.min(zoomLimit(),Math.max(.03,zoom*Math.exp(-e.deltaY*.0022)));ox=a-px/zoom;oy=b-py/zoom;invalidate()},{passive:false});
const lab=f=>()=>{if(!el('marking').hidden)f()},nudge=(dx,dy)=>()=>{ox+=(dx*(mirror?-1:1))*innerWidth*.6/zoom;oy+=dy*innerHeight*.6/zoom;invalidate()};
Shortcuts.bind({wake:invalidate,start:()=>{then=performance.now()},move:true,
  panLeft:nudge(-1,0),panRight:nudge(1,0),panUp:nudge(0,-1),panDown:nudge(0,1),
  next:spots.length?()=>go(spot+1):null,previous:spots.length?()=>go(Math.max(spot,0)-1):null,
  voxel,suggest:squares.length?e=>step(e.shiftKey?square-1:square+1):null,squares:()=>el('sq').click(),
  meshA:()=>el('meshA').click(),meshB:()=>el('meshB').click(),inkY:()=>el('inkY').click(),inkP:()=>el('inkP').click(),swap,
  spot:lab(()=>useTool('spot')),erase:lab(()=>useTool('erase')),undo:lab(undo),marks:lab(()=>el('showmarks').click()),greek:letters,
  floorDown:()=>{floor=Math.max(0,floor-8);look()},floorUp:()=>{floor=Math.min(240,floor+8);look()},
  scanDown:()=>{scan=Math.max(0,scan-.05);look()},scanUp:()=>{scan=Math.min(1,scan+.05);look()},
  mirror:()=>el('mirror').click(),full,
  back:()=>{if(!document.fullscreenElement)location.href=M.back}});
el('keyhelp').onclick=()=>Shortcuts.help(true);
const nav=document.querySelector('nav');
new ResizeObserver(()=>document.documentElement.style.setProperty('--toolbar-height',nav.offsetHeight+'px')).observe(nav);
for(const button of document.querySelectorAll('.menu>.opener'))button.setAttribute('aria-expanded','false');
addEventListener('keydown',e=>{if(e.key!=='Escape')return;const open=document.querySelector('.menu.open');if(open){open.classList.remove('open');open.querySelector('.opener').setAttribute('aria-expanded','false');open.querySelector('.opener').focus();e.stopImmediatePropagation()}else if(el('labelling').classList.contains('open')){el('labelopen').click();el('labelopen').focus();e.stopImmediatePropagation()}},true);
