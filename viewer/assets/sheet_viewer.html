<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>__TITLE__</title>
        <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #8a8a8a;
            font:
                10pt Calibri,
                Carlito,
                sans-serif;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #view {
            cursor: grab;
        }
        #view.drag {
            cursor: grabbing;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 8px 14px;
            background: #000;
            white-space: nowrap;
        }
        nav a:hover,
        nav a.here {
            color: #fff;
        }
        #tools {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
            font-variant-numeric: tabular-nums;
        }
        select,
        button {
            background: #000;
            color: #8a8a8a;
            border: 0;
            padding: 0;
            font: inherit;
            cursor: pointer;
            outline: 0;
            appearance: none;
        }
        #levels {
            display: flex;
            gap: 10px;
        }
        select:hover,
        button:hover,
        button[aria-pressed="true"] {
            color: #fff;
        }
        .group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 16px;
            border-left: 1px solid #222;
        }
        .menu {
            position: relative;
        }
        .menu > .items {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: -10px;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 12px;
            background: #000;
            border: 1px solid #222;
            z-index: 6;
            max-height: calc(100vh - var(--toolbar-height, 40px) - 12px);
            overflow-y: auto;
        }
        .menu.right > .items {
            left: auto;
            right: -10px;
            align-items: flex-end;
        }
        .menu.open > .items {
            display: flex;
        }
        .menu.open > .opener {
            color: #fff;
        }
        #marking {
            display: flex;
            gap: 12px;
        }
        #marking[hidden] {
            display: none;
        }
        #status {
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 4;
            max-width: 100%;
            pointer-events: none;
        }
        #bar {
            height: 1px;
            margin: 0 0 3px 10px;
            background: #8a8a8a;
        }
        #readout {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 2px 14px;
            padding: 2px 10px;
            background: #000;
            pointer-events: auto;
        }
        #label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #spot-coordinates {
            display: flex;
            flex-wrap: wrap;
            gap: 2px 10px;
            min-width: 0;
            color: #e0e0e0;
            font:
                12px / 1.4 ui-monospace,
                monospace;
            overflow-wrap: anywhere;
        }
        #spot-coordinates[hidden] {
            display: none;
        }
        #letters {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: min(600px, 48vw);
            z-index: 4;
            background: #000;
            pointer-events: none;
        }
        #letters[hidden] {
            display: none;
        }
        @media (max-width: 1000px) {
            .group {
                padding-left: 8px;
            }
        }
        nav {
            min-height: 40px;
            gap: 16px;
            flex-wrap: wrap;
        }
        nav > * {
            flex-shrink: 0;
        }
        #tools {
            gap: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        #tools > .group {
            flex-shrink: 0;
            gap: 10px;
            padding-left: 12px;
        }
        #yellow {
            width: 44px;
            text-align: left;
        }
        #colour {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            margin: 0 0 0 -4px;
            padding: 0;
            border: 1px solid #444;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
        }
        #colour::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        #colour::-webkit-color-swatch {
            border: 0;
            border-radius: 50%;
        }
        #colour::-moz-color-swatch {
            border: 0;
            border-radius: 50%;
        }
        #heat {
            text-align: left;
        }
        #heatkey {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        #heatkey[hidden] {
            display: none;
        }
        #heatkey i {
            width: 90px;
            height: 8px;
            background: linear-gradient(
                90deg,
                rgb(0, 0, 128),
                rgb(0, 0, 255),
                rgb(0, 128, 255),
                rgb(20, 255, 240),
                rgb(125, 255, 122),
                rgb(230, 255, 26),
                rgb(255, 153, 0),
                rgb(255, 38, 0),
                rgb(179, 0, 0)
            );
        }
        select {
            field-sizing: fixed;
            width: 160px;
            text-overflow: ellipsis;
        }
        button,
        select {
            min-height: 24px;
        }
        button:disabled {
            visibility: visible;
            opacity: 0.35;
            cursor: default;
        }
        button:focus-visible,
        select:focus-visible,
        input:focus-visible {
            outline: 1px solid #aaa;
            outline-offset: 3px;
        }
        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 64px;
            height: 24px;
            margin: 0 0 0 6px;
            vertical-align: middle;
            background: transparent;
            border: 0;
            padding: 0;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 2px;
            background: #666;
            border-radius: 1px;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            margin-top: -5px;
            border: 0;
            border-radius: 50%;
            background: #ccc;
        }
        input[type="range"]::-moz-range-track {
            height: 2px;
            background: #666;
            border-radius: 1px;
        }
        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: 0;
            border-radius: 50%;
            background: #ccc;
        }
        input[type="range"]:disabled {
            opacity: 0.35;
            cursor: default;
        }
        #levels {
            display: flex;
            gap: 10px;
        }
        #levels label,
        #tools > .group > label {
            display: inline-flex;
            align-items: center;
        }
        #labelling {
            position: relative;
        }
        #marking {
            position: fixed;
            top: calc(var(--toolbar-height, 40px) + 4px);
            right: 14px;
            z-index: 6;
            display: none;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            width: max-content;
            max-width: calc(100vw - 28px);
            padding: 10px 14px;
            background: #000;
            border: 1px solid #333;
        }
        #labelling.open #marking:not([hidden]) {
            display: flex;
        }
        #marking[hidden] {
            display: none;
        }
        #showmarks {
            width: 72px;
            text-align: left;
        }
        #region,
        #where {
            display: inline-block;
            width: 17ch;
            height: 24px;
            line-height: 24px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #previous,
        #next {
            width: 22px;
        }
        @media (max-width: 1279px) {
            #tools {
                flex-basis: 100%;
                margin-left: 0;
                justify-content: flex-start;
            }
            nav {
                column-gap: 16px;
                row-gap: 4px;
            }
            #tools > .group:first-child {
                border-left: 0;
                padding-left: 0;
            }
        }
        </style>
    </head>
    <body>
        <canvas id="tiles"></canvas><canvas id="view"></canvas>
        <nav>
            <a class="here" id="back" href="../index.html">HerculeX</a>
            <span class="menu"
                ><button type="button" class="opener">Pages</button
                ><span class="items"
                    ><a href="../../atlas/index.html">Alphabet</a
                    ><a href="../../atlas/lines.html">Lines</a
                    ><a href="../../atlas/published.html">Published</a></span
                ></span
            >
            <span id="tools">
                <span class="group"
                    ><select id="layers" aria-label="Layer"></select
                    ><button type="button" id="yellow" aria-pressed="false" title="Y">
                        Yellow
                    </button><input
                        id="colour"
                        type="color"
                        aria-label="Ink colour"
                        title="Ink colour (right-click for the page's own)"
                    ><button
                        type="button"
                        id="heat"
                        aria-pressed="false"
                        title="Ink in colours by its strength (I)"
                    >
                        Heat
                    </button></span
                ><span class="group" id="levels"
                    ><label
                        >Ink<input
                            id="floor"
                            type="range"
                            min="0"
                            max="240"
                            step="4"
                            aria-label="Weakest ink shown"
                        ></label
                    ><label
                        >Scan<input
                            id="scan"
                            type="range"
                            min="0"
                            max="100"
                            step="5"
                            aria-label="Brightness of the scan under the ink"
                        ></label
                    ></span
                ><span class="group"
                    ><button
                        type="button"
                        id="swap"
                        disabled
                        title="No alternative ink layer on this page"
                    >
                        Swap ink
                    </button><button
                        type="button"
                        id="suggested"
                        disabled
                        title="No suggested areas on this page"
                    >
                        Suggested
                    </button></span
                >
                <span class="group" id="labelling"
                    ><button
                        type="button"
                        id="labelopen"
                        disabled
                        aria-expanded="false"
                        aria-controls="marking"
                        aria-pressed="false"
                        title="Trace letters, circle interesting places"
                    >
                        Label
                    </button><span id="marking" role="group" aria-label="Labeling tools" hidden
                        ><button
                            type="button"
                            id="mark"
                            aria-pressed="false"
                            title="Trace letters (G)"
                        >
                            Letters
                        </button><button
                            type="button"
                            id="spotmark"
                            aria-pressed="false"
                            title="Circle an interesting place (C)"
                        >
                            Spot
                        </button><button type="button" id="erase" aria-pressed="false" title="X">
                            Erase
                        </button><button type="button" id="undo" title="Z">Undo</button
                        ><button type="button" id="showmarks" title="L">Hide marks</button></span
                    ></span
                >
                <span class="group"
                    ><button type="button" id="previous" aria-label="Previous area" title="P">
                        ←
                    </button><span id="region"></span
                    ><button type="button" id="next" aria-label="Next area" title="N">
                        →
                    </button></span
                >
                <span class="menu right"
                    ><button type="button" class="opener">View</button
                    ><span class="items"
                        ><button type="button" id="fit">Fit</button
                        ><button type="button" id="native">1:1</button
                        ><button type="button" id="minus" aria-label="Zoom out">Zoom out −</button
                        ><button type="button" id="plus" aria-label="Zoom in">Zoom in +</button
                        ><button type="button" id="mirror" aria-pressed="false" title="H">
                            Mirror
                        </button><button type="button" id="paper" aria-pressed="false">
                            Invert
                        </button><button type="button" id="greek" aria-pressed="false" title="K">
                            Greek letters
                        </button><button type="button" id="fullscreen" title="F">Full screen</button
                        ><button type="button" id="keyhelp" title="?">
                            Keyboard shortcuts
                        </button></span
                    ></span
                >
            </span>
        </nav>
        <img
            id="letters"
            src="../../atlas/alphabet/strip.png"
            alt="The Greek alphabet in real letters of the scrolls"
            hidden
        >
        <footer id="status">
            <div id="bar"></div>
            <div id="readout">
                <output id="spot-coordinates" aria-label="Spot bounds" aria-live="off" hidden
                    ><span></span> <span></span> <span></span></output
                ><span id="heatkey" hidden>weak <i></i> strong</span><span id="label"></span>
            </div>
        </footer>
        <script src="../../website/shortcuts.js"></script>
        <script src="../../website/spot_coordinates.js"></script>
        <script src="../../website/mark_writes.js"></script>
        <script>
        const M = __META__,
            TOP = 32,
            kept = (() => {
                try {
                    return JSON.parse(localStorage.inkLook || "{}");
                } catch (_) {
                    return {};
                }
            })();
        const floor = kept.floor ?? __FLOOR__,
            scan = kept.scan ?? __SCAN__;
        </script>
        <script src="../../website/sheet_gl.js"></script>
    </body>
</html>
